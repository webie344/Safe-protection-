<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050B15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SafeSignal">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Your AI-powered digital safety assistant. Detect scams, verify crypto, check websites, get smart replies, and understand confusing messages.">
  <meta property="og:title" content="SafeSignal — AI Safety Assistant">
  <meta property="og:description" content="Detect scams, verify crypto, check websites instantly with AI.">
  <meta property="og:image" content="icons/icon-512.png">

  <title>SafeSignal — AI Safety Assistant</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-startup-image" href="images/onboard-1.png">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">

  <!-- NOTE: Serve over HTTPS for PWA features and Firebase Auth.
       For local testing: use `npx serve .` or `python3 -m http.server`
       ES modules require a server (won't work with file://) -->
</head>
<body>
  <div id="app">
    <!-- App renders here -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
      <div style="width:56px;height:56px;border:3px solid #00D4FF40;border-top-color:#00D4FF;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <p style="color:#9CA3AF;font-size:14px">Starting SafeSignal...</p>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="window.closeModal()">
    <div id="modal-box" class="modal-box" onclick="event.stopPropagation()"></div>
  </div>

  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
